services:

  broker:

    image: eclipse-mosquitto

    container_name: mqtt_broker

    ports:
      - "1883:1883"

    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf

  ai_node:

    build:
      context: .
      dockerfile: ai_engine/Dockerfile

    container_name: ai_node

    depends_on:
      - broker

    environment:
      - MQTT_BROKER=broker

    volumes:
      - ./camera_input/captured_frames:/app/camera_input/captured_frames
      - ./monitoring/logs:/app/monitoring/logs

  dashboard_node:

    build:
      context: .
      dockerfile: dashboard_node/Dockerfile

    container_name: dashboard_node

    depends_on:
      - broker

    environment:
      - MQTT_BROKER=broker